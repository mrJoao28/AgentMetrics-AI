[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmetrics-ai"
version = "0.1.0"
description = "Reproducible evaluation of conversational AI agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "plotly>=5.0"]

[project.scripts]
agentmetrics = "agentmetrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
