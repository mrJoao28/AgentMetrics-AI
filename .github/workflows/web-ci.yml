name: Web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/persistent-evaluations]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Smoke test built web application and Open Graph image
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/agentmetrics-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
